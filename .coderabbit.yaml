language: "ko-KR"

reviews:
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    base_branches:
      - "main"
      - "dev"
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "chore"
      - "docs"

  path_filters:
    - "!.next/**"
    - "!node_modules/**"
    - "!prisma/migrations/**"
    - "!public/**"
    - "!*.md"

  instructions: |
    This is a Next.js 14 (App Router) + TypeScript + Prisma 7 + Supabase project.
    It is a setlist database for Japanese anime/game live events targeting Korean users.

    Focus on:
    - Null checks on Prisma query results (findUnique/findFirst can return null)
    - N+1 query patterns in loops
    - Missing error handling in API routes and server actions
    - Hardcoded values that should be environment variables
    - Type safety issues (avoid any)
    - Missing loading/error states in React components
    - BigInt handling (IDs are BigInt in Prisma schema)
    - Locale handling in i18n (next-intl)
    - Check-then-write (findFirst/findUnique, then delete/update by id)
      that is not protected by an atomic conditional write, a row or
      advisory lock, or a SERIALIZABLE transaction with conflict retry — a
      plain $transaction (READ COMMITTED) does not protect it: two concurrent
      requests both pass the check and the loser's write throws (Prisma
      P2025 → 500). Expect one conditional deleteMany/updateMany whose where
      carries the check, with a lookup only when the count is 0 to choose
      404 vs 403

    Skip:
    - Stylistic preferences already handled by ESLint
    - Comments about adding more tests (no test suite yet)
    - Suggestions to add logging
