language: "ko-KR"

reviews:
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    base_branches:
      - "main"
      - "dev"
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "chore"
      - "docs"

  path_filters:
    - "!.next/**"
    - "!node_modules/**"
    - "!prisma/migrations/**"
    - "!public/**"
    - "!*.md"

  instructions: |
    This is a Next.js 14 (App Router) + TypeScript + Prisma 7 + Supabase project.
    It is a setlist database for Japanese anime/game live events targeting Korean users.

    Focus on:
    - Null checks on Prisma query results (findUnique/findFirst can return null)
    - N+1 query patterns in loops
    - Missing error handling in API routes and server actions
    - Hardcoded values that should be environment variables
    - Type safety issues (avoid any)
    - Missing loading/error states in React components
    - BigInt handling (IDs are BigInt in Prisma schema)
    - Locale handling in i18n (next-intl)
    - Check-then-write (findFirst/findUnique, then delete/update by id)
      that is not protected by an atomic conditional write, a row or
      advisory lock, or a SERIALIZABLE transaction with conflict retry — a
      plain $transaction (READ COMMITTED) does not protect it: two concurrent
      requests both pass the check and the loser's write throws (Prisma
      P2025 → 500). Expect one conditional deleteMany/updateMany whose where
      carries the check, with a lookup only when the count is 0 to choose
      404 vs 403
    - Write helpers that carry prior state over by default (keep a flag or
      field unless the caller passes a new value): check every transition
      that should end it — emptying the collection, a reset, a replace.
      A carried-over flag on an emptied list leaks onto whatever the user
      builds next
    - Tests that assert something is absent ("X stays out", "not rendered",
      "not called") need a positive control: the same test must show X was
      loaded, rendered, or reachable first. A fixture in the wrong storage
      shape loads nothing, and the absence check then passes vacuously
    - A `.catch(() => null)` result (e.g. `await res.json().catch(() => null)`)
      must be null-checked before an `as` cast and property access: the cast
      hides the null, and the TypeError can leave the UI stuck in a pending
      state (a cover editor locked on "saving")
    - `??` on a nullable domain value where `null` itself means something
      ("no cover", "cleared"): `fresh ?? older` replaces that null with the
      older value. Branch on whether the object is present instead
    - Serialized Prisma rows: a nullable column (e.g.
      `Event.date DateTime? @db.Date`) must be null-checked before
      `String(...)`, a template literal, or `new Date(...)`: `String(null)`
      yields "null" and `new Date(null)` the epoch, so an event without a
      date renders `dateTime="null"` and sorts on a NaN or 1970 key
    - Admin route translation writes are per-locale upserts (src/app/api/admin/stage-identities/[id]/route.ts), never `<x>Translation.deleteMany` + recreate: a partial save wipes the locales and columns it did not send

    Skip:
    - Stylistic preferences already handled by ESLint
    - Tailwind arbitrary pixel values (`text-[11px]`, `rounded-[14px]`) — the
      house style for sizes; scale tokens like `text-xs` also set line-height
    - Requests for more tests on code the diff doesn't touch
    - Suggestions to add logging
