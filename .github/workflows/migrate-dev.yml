name: Migrate Dev DB

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      accept_data_loss:
        description: 'Allow destructive schema changes (drops enum values, columns, etc.). Not needed for additive-only diffs.'
        type: boolean
        required: false
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm install
      - name: Push schema to dev DB
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL_UNPOOLED }}
          ACCEPT_DATA_LOSS: ${{ inputs.accept_data_loss }}
        # Additive-only diffs pass --accept-data-loss automatically (a new
        # unique index is always flagged). A diff that drops a column, a
        # table, or an index of a kept table FAILS the job instead, with
        # the statements printed: db push drops an EMPTY column silently,
        # and on dev that column is usually an unmerged branch's (re-run
        # this workflow with --ref <that branch> afterwards). An intended
        # drop needs a manual dispatch with accept_data_loss=true. See
        # scripts/schema-push.sh.
        run: bash scripts/schema-push.sh "${ACCEPT_DATA_LOSS:-false}"
      - name: Apply post-deploy SQL (idempotent partial indexes etc.)
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL_UNPOOLED }}
        run: npx prisma db execute --file prisma/post-deploy.sql
      - name: Check anon/authenticated exposure of public tables
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL_UNPOOLED }}
        # Supabase grants anon/authenticated ALL on every new public table
        # and the browser holds the anon key. Fails when a table reachable
        # by those roles is not in prisma/anon-exposed-tables.txt — lock it
        # down in post-deploy.sql (see the ImageAsset block) instead.
        # Read-only (BEGIN READ ONLY, no session SET).
        run: node scripts/check-anon-exposure.mjs
