name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    name: Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Lint runs after prisma generate (so generated types resolve in
      # imports) and before Typecheck (faster failure on style — the type
      # pass is more expensive). Errors fail the gate; existing warnings
      # don't (no --max-warnings=0 yet — that's a follow-up). `lint` runs
      # ESLint, then stylelint over CSS modules (stylelint.config.mjs),
      # whose hex-colour rule is a warning on the same terms.
      - name: Lint
        run: npm run lint

      # Unused files / exports (knip.config.ts). Report-only for now: the
      # first runs list existing dead code that the owner clears item by
      # item; drop continue-on-error once the report is empty.
      - name: Dead code (report only)
        run: npm run lint:dead
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test
