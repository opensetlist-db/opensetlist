name: Semgrep

# feature/redesign is the long-lived integration branch for the site
# redesign: app task PRs target it and it reaches dev only through one
# final PR, so its PRs and pushes need the same gates as dev's.
on:
  pull_request:
    branches: [main, dev, feature/redesign]
  push:
    branches: [main, dev, feature/redesign]
  schedule:
    # Weekly Monday 00:00 KST = 15:00 UTC Sunday — catches newly released rules.
    - cron: "0 15 * * 0"

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: semgrep ci --config=p/default --config=p/secrets --config=p/typescript --config=p/owasp-top-ten
