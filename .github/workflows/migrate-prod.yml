name: Migrate Production DB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      accept_data_loss:
        description: 'Allow destructive schema changes (drops enum values, columns, etc.). Not needed for additive-only diffs.'
        type: boolean
        required: false
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Push schema to production DB
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}
          ACCEPT_DATA_LOSS: ${{ inputs.accept_data_loss }}
        # Additive-only diffs pass --accept-data-loss automatically (a new
        # unique index is always flagged). A diff that drops a column, a
        # table, or an index of a kept table FAILS the job instead, with
        # the statements printed: db push drops an EMPTY column silently,
        # and on dev that column is usually an unmerged branch's (re-run
        # this workflow with --ref <that branch> afterwards). An intended
        # drop needs a manual dispatch with accept_data_loss=true. See
        # scripts/schema-push.sh.
        run: bash scripts/schema-push.sh "${ACCEPT_DATA_LOSS:-false}"
      - name: Apply post-deploy SQL (idempotent partial indexes etc.)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}
        run: npx prisma db execute --file prisma/post-deploy.sql
      - name: Verify migration
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}
        run: npx prisma db pull --print
